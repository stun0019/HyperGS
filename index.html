<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>午夜淘汰賽</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  font-family: "Microsoft JhengHei", Arial, sans-serif;
  background: #050811;
  color: #f2f6ff;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  display: grid;
  place-items: center;
  background: #050811;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: none;
}

button:focus-visible {
  outline: 3px solid #ffe49b;
  outline-offset: 4px;
}

#game {
  position: relative;
  width: min(100vw, 177.7778dvh, 1280px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  container-type: inline-size;
  background: #080e1d;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.topbar {
  position: absolute;
  top: 3.2%;
  left: 3%;
  right: 3%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.rank-block {
  border-left: .3cqw solid #79f2d4;
  padding-left: 1.2cqw;
}

.label {
  color: #96abc2;
  font-size: .9cqw;
  letter-spacing: .2cqw;
}

.rank-value {
  font-size: 3.8cqw;
  line-height: 1.1;
  font-weight: 900;
  font-style: italic;
}

.rank-value small {
  color: #7b91ac;
  font-size: 1.5cqw;
}

.elimination {
  min-width: 17cqw;
  text-align: center;
  padding: .9cqw 2cqw;
  background: #0c1421d9;
  border: 1px solid #718bab35;
  border-top: 2px solid #e3b768;
}

.elimination .label {
  color: #ddc08c;
}

#timer {
  font: bold 2.8cqw monospace;
  line-height: 1.25;
}

.elimination.danger {
  border-top-color: #ff6f75;
  background: #3c1427db;
}

.elimination.danger #timer {
  color: #ff9194;
}

.top-actions {
  display: flex;
  gap: .7cqw;
  pointer-events: auto;
}

.small-button {
  min-width: 4.5cqw;
  min-height: 3.5cqw;
  padding: .7cqw 1cqw;
  border: 1px solid #819ab53b;
  background: #0b1626cf;
  color: #d4e0ed;
  font-size: 1cqw;
}

#leaderboard {
  position: absolute;
  top: 25%;
  left: 3%;
  width: 13.5cqw;
  display: flex;
  flex-direction: column;
  gap: .35cqw;
}

.leader {
  display: grid;
  grid-template-columns: 1.8cqw 1fr auto;
  gap: .5cqw;
  align-items: center;
  padding: .55cqw .7cqw;
  background: #0a1322a8;
  border-left: 2px solid #465a72;
  color: #9bb0c7;
  font-size: .95cqw;
}

.leader.me {
  background: #12352ed9;
  border-color: #79f2d4;
  color: #dbfff3;
}

.leader.last {
  border-color: #ff777e;
}

.leader.out {
  opacity: .35;
}

.leader .gap {
  font: .8cqw monospace;
}

#toast {
  position: absolute;
  top: 26%;
  left: 24%;
  right: 24%;
  text-align: center;
  color: #edfff9;
  font-size: 1.6cqw;
  font-weight: bold;
  letter-spacing: .15cqw;
  text-shadow: 0 2px 12px #000;
  opacity: 0;
  transition: opacity .15s;
}

#toast.show {
  opacity: 1;
}

#warning {
  position: absolute;
  top: 39%;
  left: 24%;
  right: 24%;
  text-align: center;
  font-size: 1.1cqw;
  color: #ffadb0;
  letter-spacing: .16cqw;
  text-shadow: 0 2px 8px #000;
}

.bottom-left {
  position: absolute;
  left: 3%;
  bottom: 5%;
}

.speed {
  display: flex;
  align-items: baseline;
  gap: .7cqw;
}

#speed {
  font: italic bold 4.5cqw monospace;
  color: #f2f8ff;
  line-height: 1;
}

.speed-unit {
  font-size: 1cqw;
  color: #88a1bc;
}

.control-note {
  margin-top: 1cqw;
  font-size: .95cqw;
  color: #90a9c3;
}

.bottom-center {
  position: absolute;
  bottom: 5%;
  left: 35%;
  width: 30%;
}

.nitro-label {
  display: flex;
  justify-content: space-between;
  font-size: .95cqw;
  letter-spacing: .12cqw;
  color: #b9dce6;
  margin-bottom: .6cqw;
}

.nitro-track {
  height: .7cqw;
  background: #122639;
  border: 1px solid #4a798455;
  transform: skewX(-15deg);
}

#nitroFill {
  width: 65%;
  height: 100%;
  background: linear-gradient(90deg, #51c7e9, #a4ffdd);
  box-shadow: 0 0 16px #62e5db44;
}

#combo {
  height: 1.5cqw;
  margin-top: .8cqw;
  color: #e3c887;
  text-align: center;
  font-size: .95cqw;
}

#nitroButton {
  position: absolute;
  right: 3%;
  bottom: 5%;
  width: 13.3cqw;
  height: 6.3cqw;
  pointer-events: auto;
  color: #ddfff8;
  border: 1px solid #76ead4;
  background: linear-gradient(135deg, #254853ec, #142d40e8);
  transform: skewX(-8deg);
  box-shadow: inset 0 0 20px #55dbc21c;
}

#nitroButton span {
  display: block;
  transform: skewX(8deg);
  font-size: 1.7cqw;
  font-weight: bold;
  letter-spacing: .3cqw;
}

#nitroButton small {
  display: block;
  transform: skewX(8deg);
  font-size: .8cqw;
  color: #9bc9c7;
  margin-top: .4cqw;
}

#nitroButton.pressed {
  color: #fff;
  background: #368f93e8;
  box-shadow: 0 0 35px #66f5d944;
}

#nitroButton.empty {
  opacity: .4;
}

#countdown {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  color: #d8fff0;
  font: italic bold 10cqw monospace;
  text-shadow: 0 0 45px #77eacd66;
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  align-items: center;
  gap: 6cqw;
  padding: 5cqw 8cqw;
  background: linear-gradient(100deg, #070e1cf5, #0b182ae8);
}

.overlay[hidden] {
  display: none;
}

.eyebrow {
  color: #75d9c5;
  font: .95cqw monospace;
  letter-spacing: .35cqw;
}

h1 {
  margin: 1.3cqw 0;
  font-size: 5.8cqw;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: .2cqw;
  white-space: pre-line;
}

#overlayDescription {
  margin: 1.6cqw 0 0;
  color: #9fb2c9;
  font-size: 1.15cqw;
  line-height: 1.9;
  white-space: pre-line;
}

.info-box {
  padding: 2cqw;
  border: 1px solid #7294af33;
  background: #101f3099;
}

.info-title {
  color: #e0c591;
  font-size: 1.05cqw;
  letter-spacing: .15cqw;
  margin-bottom: 1.2cqw;
}

#overlayInfo {
  white-space: pre-line;
  font-size: 1.13cqw;
  line-height: 2.1;
  color: #c0ccdb;
}

.main-button {
  width: 100%;
  margin-top: 1.7cqw;
  padding: 1.2cqw;
  border: 1px solid #8cebcf;
  background: #8cebcf;
  color: #102c2b;
  font-size: 1.35cqw;
  font-weight: bold;
  letter-spacing: .2cqw;
}

.secondary-button {
  width: 100%;
  margin-top: .8cqw;
  padding: .8cqw;
  border: 1px solid #60798d66;
  background: transparent;
  color: #9bb2c5;
  font-size: .95cqw;
}

#rotateHint {
  position: fixed;
  bottom: max(18px, env(safe-area-inset-bottom));
  left: 15px;
  right: 15px;
  color: #8b9db6;
  text-align: center;
  font-size: 13px;
  display: none;
  pointer-events: none;
}

@media (orientation: portrait) {
  #rotateHint {
    display: block;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>
<main id="game">
  <canvas id="canvas" width="1280" height="720"
    aria-label="午夜淘汰賽，橫向賽車遊戲"></canvas>

  <div class="hud">
    <div class="topbar">
      <div class="rank-block">
        <div class="label">目前名次</div>
        <div class="rank-value">
          <span id="rank">8</span><small id="total"> / 8</small>
        </div>
      </div>

      <div class="elimination" id="eliminationBox">
        <div class="label">淘汰最後一名</div>
        <div id="timer">12.0</div>
      </div>

      <div class="top-actions">
        <button class="small-button" id="soundButton" aria-pressed="false">音效 關</button>
        <button class="small-button" id="pauseButton">暫停</button>
      </div>
    </div>

    <div id="leaderboard"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="warning"></div>

    <div class="bottom-left">
      <div class="speed">
        <span id="speed">000</span>
        <span class="speed-unit">KM/H</span>
      </div>
      <div class="control-note">拖曳畫面轉向 / 自動油門</div>
    </div>

    <div class="bottom-center">
      <div class="nitro-label">
        <span>NITRO</span>
        <span id="nitroText">65%</span>
      </div>
      <div class="nitro-track"><div id="nitroFill"></div></div>
      <div id="combo">貼身超車補充氮氣</div>
    </div>

    <button id="nitroButton" aria-label="按住使用氮氣">
      <span>氮氣</span>
      <small>按住釋放 / SPACE</small>
    </button>
  </div>

  <div id="countdown"></div>

  <section class="overlay" id="overlay">
    <div>
      <div class="eyebrow" id="overlayTag">MIDNIGHT / ELIMINATION</div>
      <h1 id="overlayTitle">午夜
淘汰賽</h1>
      <p id="overlayDescription"></p>
    </div>

    <div class="info-box">
      <div class="info-title" id="infoTitle">賽事規則</div>
      <div id="overlayInfo"></div>
      <button class="main-button" id="mainButton">開始比賽</button>
      <button class="secondary-button" id="secondaryButton">進入全螢幕</button>
    </div>
  </section>
</main>

<div id="rotateHint">請將手機橫放，取得完整賽車畫面。</div>

<script>
"use strict";

/*
  1280 × 720 橫式手機賽車
  單檔 HTML / CSS / Canvas / JavaScript
  不使用外部圖片、SVG、Emoji 或第三方套件。

  手機：
    在賽道區域左右拖曳轉向。
    另一根手指按住右下角氮氣。

  電腦：
    A、D 或方向鍵轉向。
    Space 使用氮氣。
    P 暫停。

  八名車手，每十二秒淘汰最後一名。
  共七輪，存活到最後獲勝。
*/

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const W = 1280;
const H = 720;
const HORIZON = 170;
const ROAD_BOTTOM = 646;
const ROAD_WIDTH = 475;
const VIEW_DISTANCE = 1050;
const ELIMINATION_INTERVAL = 12;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const lerp = (a, b, t) => a + (b - a) * t;

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

let mode = "menu";
let race = null;
let previousTime = 0;
let hudTime = 0;
let menuTime = 0;
let mainAction = null;

const input = {
  left: false,
  right: false,
  boostKey: false,
  boostPointer: null,
  steerPointer: null,
  originScreenX: 0,
  originCarX: 0,
  targetX: 0
};

let audio = null;
let engine = null;
let engineGain = null;
let soundEnabled = false;

const carColors = [
  "#ff767f", "#ffc96b", "#8e9dff",
  "#e5ecf6", "#ce84df", "#6eb4fb", "#8ece88"
];

const driverNames = [
  "赤焰", "黃蜂", "幽影", "白夜", "紫電", "藍霧", "野狼"
];

const buildings = Array.from({ length: 42 }, (_, i) => ({
  x: i * 39 - 140,
  width: 24 + ((i * 23) % 38),
  height: 40 + ((i * 47) % 155),
  tint: i % 3,
  seed: i
}));

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function activeDrivers() {
  return race.drivers
    .filter(driver => driver.alive)
    .sort((a, b) => b.s - a.s || a.id - b.id);
}

function resetInput() {
  input.left = false;
  input.right = false;
  input.boostKey = false;
  input.boostPointer = null;
  input.steerPointer = null;
  $("nitroButton").classList.remove("pressed");
}

function prepareAudio() {
  if (!soundEnabled) return;

  try {
    if (!audio) {
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioClass) return;

      audio = new AudioClass();
      engine = audio.createOscillator();
      engineGain = audio.createGain();

      engine.type = "triangle";
      engineGain.gain.value = 0;

      engine.connect(engineGain);
      engineGain.connect(audio.destination);
      engine.start();
    }

    if (audio.state === "suspended") {
      audio.resume().catch(() => {});
    }
  } catch (_) {
    soundEnabled = false;
    $("soundButton").textContent = "音效 關";
    $("soundButton").setAttribute("aria-pressed", "false");
  }
}

function beep(frequency, duration, gain = .025, type = "sine") {
  if (!soundEnabled || !audio) return;

  try {
    const oscillator = audio.createOscillator();
    const envelope = audio.createGain();
    const now = audio.currentTime;

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    envelope.gain.setValueAtTime(gain, now);
    envelope.gain.exponentialRampToValueAtTime(.001, now + duration);

    oscillator.connect(envelope);
    envelope.connect(audio.destination);
    oscillator.start(now);
    oscillator.stop(now + duration);

    oscillator.onended = () => {
      oscillator.disconnect();
      envelope.disconnect();
    };
  } catch (_) {}
}

function updateAudio() {
  if (!audio || !engine || !engineGain) return;

  const playing = soundEnabled && mode === "racing";
  const speed = race ? race.player.speed : 0;

  engineGain.gain.setTargetAtTime(
    playing ? .016 : 0,
    audio.currentTime,
    .1
  );

  engine.frequency.setTargetAtTime(
    45 + speed * .48,
    audio.currentTime,
    .08
  );
}

function showOverlay(tag, title, description, info, button, action) {
  $("overlayTag").textContent = tag;
  $("overlayTitle").textContent = title;
  $("overlayDescription").textContent = description;
  $("overlayInfo").textContent = info;
  $("mainButton").textContent = button;
  mainAction = action;
  $("overlay").hidden = false;
}

function startRace() {
  resetInput();
  prepareAudio();

  const player = {
    id: 0,
    name: "你",
    x: 0,
    s: 0,
    speed: 0,
    color: "#8affd8",
    alive: true,
    steer: 0,
    hitCooldown: 0
  };

  const drivers = [player];

  for (let i = 0; i < 7; i++) {
    drivers.push({
      id: i + 1,
      name: driverNames[i],
      x: [-.66, 0, .66][i % 3],
      s: 27 + Math.floor(i / 3) * 32,
      speed: 0,
      cruise: 211 + i * 2.8 + rand(-4, 4),
      color: carColors[i],
      alive: true,
      lane: [-.66, 0, .66][i % 3],
      laneTimer: rand(2, 5),
      phase: rand(0, Math.PI * 2),
      hitCooldown: 0,
      passed: false,
      closePass: false,
      collided: false
    });
  }

  race = {
    player,
    drivers,
    elapsed: 0,
    countdown: 3.2,
    lastCountdown: 4,
    nextElimination: ELIMINATION_INTERVAL,
    round: 0,
    nitro: 65,
    boosting: false,
    boostLock: false,
    overtakes: 0,
    nearMisses: 0,
    collisions: 0,
    topSpeed: 0,
    combo: 0,
    comboTimer: 0,
    toast: "",
    toastTimer: 0,
    shake: 0,
    flash: 0,
    rank: 8,
    finishRank: 8
  };

  mode = "countdown";
  $("overlay").hidden = true;
  $("countdown").textContent = "3";
  $("toast").classList.remove("show");
  $("warning").textContent = "";
  updateHUD();
}

function notify(text, seconds = 2) {
  if (!race) return;
  race.toast = text;
  race.toastTimer = seconds;
  $("toast").textContent = text;
  $("toast").classList.add("show");
}

function pauseRace() {
  if (mode !== "racing" && mode !== "countdown") return;

  race.resumeMode = mode;
  mode = "paused";
  resetInput();

  $("countdown").textContent = "";

  $("infoTitle").textContent = "操作方式";

  showOverlay(
    "RACE PAUSED",
    "比賽暫停",
    "比賽時間已停止。\n準備好後，繼續爭取下一個名次。",
    "左右拖曳畫面：轉向\n按住氮氣按鈕：加速\n電腦：A / D、方向鍵、Space",
    "繼續比賽",
    () => {
      mode = race.resumeMode;
      $("overlay").hidden = true;
      prepareAudio();
    }
  );

  updateAudio();
}

function endRace(won, place) {
  mode = "finished";
  race.finishRank = place;
  resetInput();
  $("countdown").textContent = "";
  $("warning").textContent = "";

  let best = 8;

  try {
    const stored = Number(localStorage.getItem("midnight-best-rank"));
    if (stored >= 1 && stored <= 8) best = stored;

    best = Math.min(best, place);
    localStorage.setItem("midnight-best-rank", String(best));
  } catch (_) {
    best = place;
  }

  $("infoTitle").textContent = "本場成績";

  showOverlay(
    won ? "LAST DRIVER STANDING" : "ELIMINATED",
    won ? "午夜冠軍" : "遭到淘汰",
    won
      ? "最後一個檢查點，只剩下你。\n這條路，今晚屬於你。"
      : "檢查點關閉時，你落在最後一名。\n提前存好氮氣，下一輪再超回來。",
    "最終名次：第 " + place + " 名\n" +
    "完成超車：" + race.overtakes + " 次\n" +
    "貼身超車：" + race.nearMisses + " 次\n" +
    "最高速度：" + Math.round(race.topSpeed) + " km/h\n" +
    "最佳名次：第 " + best + " 名",
    "再跑一場",
    startRace
  );

  updateHUD();
  updateAudio();
  beep(won ? 780 : 120, .5, .04, "triangle");
}

function eliminateLast() {
  const order = activeDrivers();
  const eliminated = order[order.length - 1];

  eliminated.alive = false;
  race.round++;

  if (eliminated.id === 0) {
    endRace(false, order.length);
    return;
  }

  notify(
    eliminated.name + " 已淘汰 / 剩餘 " + (order.length - 1) + " 台",
    2.5
  );

  beep(230, .2, .025, "triangle");

  const remaining = activeDrivers();

  if (remaining.length === 1) {
    endRace(true, 1);
    return;
  }

  race.nextElimination += ELIMINATION_INTERVAL;
}

function curveAt(s) {
  return Math.sin(s / 760) * .68 +
    Math.sin(s / 1690 + .5) * .33;
}

function worldCenter(s) {
  return Math.sin(s / 760) * 190 +
    Math.sin(s / 1690 + .5) * 270;
}

function update(dt) {
  if (mode === "menu") {
    menuTime += dt;
    return;
  }

  if (!race) return;

  if (mode === "countdown") {
    race.countdown -= dt;
    const number = Math.ceil(race.countdown);

    if (number !== race.lastCountdown && number > 0) {
      race.lastCountdown = number;
      $("countdown").textContent = String(number);
      beep(430, .1);
    }

    if (race.countdown <= 0) {
      mode = "racing";
      $("countdown").textContent = "";
      notify("起跑 / 每 12 秒淘汰最後一名", 2.5);
      beep(850, .3);
    }

    return;
  }

  if (mode !== "racing") return;

  const player = race.player;
  race.elapsed += dt;

  race.toastTimer = Math.max(0, race.toastTimer - dt);
  race.shake = Math.max(0, race.shake - dt * 15);
  race.flash = Math.max(0, race.flash - dt * 2);
  race.comboTimer = Math.max(0, race.comboTimer - dt);

  if (race.comboTimer === 0) race.combo = 0;
  if (race.toastTimer === 0) $("toast").classList.remove("show");

  player.hitCooldown = Math.max(0, player.hitCooldown - dt);

  let steering = Number(input.right) - Number(input.left);

  if (input.steerPointer !== null) {
    steering = clamp((input.targetX - player.x) * 5, -1, 1);
  }

  player.steer = lerp(player.steer, steering, Math.min(1, dt * 12));

  const boostHeld = input.boostKey || input.boostPointer !== null;

  if (!boostHeld) race.boostLock = false;

  race.boosting =
    boostHeld &&
    race.nitro > 0 &&
    !race.boostLock &&
    Math.abs(player.x) < 1.08;

  if (race.boosting) {
    race.nitro = Math.max(0, race.nitro - 22 * dt);

    if (race.nitro <= 0) {
      race.boostLock = true;
    }
  } else {
    race.nitro = Math.min(100, race.nitro + 3.7 * dt);
  }

  const offroad = Math.abs(player.x) > 1;
  const targetSpeed = offroad ? 125 : race.boosting ? 326 : 244;
  const acceleration = targetSpeed > player.speed ? 86 : 135;

  player.speed += clamp(
    targetSpeed - player.speed,
    -acceleration * dt,
    acceleration * dt
  );

  const steeringPower = .45 + player.speed / 255;

  player.x += player.steer * steeringPower * dt;
  player.x -= curveAt(player.s) * (player.speed / 244) * .20 * dt;
  player.x = clamp(player.x, -1.35, 1.35);
  player.s += player.speed * .60 * dt;

  race.topSpeed = Math.max(race.topSpeed, player.speed);

  for (const driver of race.drivers) {
    if (driver.id === 0 || !driver.alive) continue;

    driver.hitCooldown = Math.max(0, driver.hitCooldown - dt);
    driver.laneTimer -= dt;

    if (driver.laneTimer <= 0) {
      driver.laneTimer = rand(2.6, 5.5);
      driver.lane = [-.69, -.34, .0, .34, .69][Math.floor(rand(0, 5))];
    }

    let aiTarget = driver.cruise +
      Math.sin(race.elapsed * .7 + driver.phase) * 8;

    // 電腦車會避讓前車並嘗試換線，不直接傳送位置。
    for (const other of race.drivers) {
      if (other === driver || !other.alive) continue;

      const ahead = other.s - driver.s;
      const lateral = Math.abs(other.x - driver.x);

      if (ahead > 0 && ahead < 32 && lateral < .22) {
        const direction = driver.x < other.x ? -1 : 1;
        driver.lane = clamp(driver.x + direction * .42, -.78, .78);
        aiTarget -= 18;
      }
    }

    driver.x += clamp(driver.lane - driver.x, -.48 * dt, .48 * dt);
    driver.x += Math.sin(race.elapsed + driver.phase) * .008 * dt;
    driver.x = clamp(driver.x, -.87, .87);

    driver.speed += clamp(
      aiTarget - driver.speed,
      -95 * dt,
      69 * dt
    );

    const before = driver.s - player.s;
    driver.s += driver.speed * .60 * dt;
    const after = driver.s - player.s;
    const lateral = Math.abs(driver.x - player.x);

    // 近距離並排時記錄是否符合貼身超車條件。
    if (Math.abs(after) < 17 && lateral > .16 && lateral < .34) {
      driver.closePass = true;
    }

    // 碰撞只減速，短暫冷卻避免同一接觸連續扣速。
    if (
      Math.abs(after) < 15 &&
      lateral < .155 &&
      player.hitCooldown <= 0 &&
      driver.hitCooldown <= 0
    ) {
      player.speed = Math.max(85, player.speed * .67);
      driver.speed *= .86;

      const push = player.x >= driver.x ? 1 : -1;
      player.x = clamp(player.x + push * .10, -1.35, 1.35);

      player.hitCooldown = 1.1;
      driver.hitCooldown = 1.1;
      driver.collided = true;
      driver.closePass = false;

      race.collisions++;
      race.combo = 0;
      race.comboTimer = 0;
      race.shake = 6;
      race.flash = .28;

      notify("發生碰撞 / 速度下降", 1.1);
      beep(78, .16, .035, "sawtooth");
    }

    if (after > 25 && before > 0) {
      driver.passed = false;
      driver.collided = false;
      driver.closePass = false;
    }

    // 真正超過一段距離後才算完成超車。
    if (after < -18 && !driver.passed) {
      driver.passed = true;
      race.overtakes++;

      if (driver.closePass && !driver.collided) {
        race.nearMisses++;
        race.combo++;
        race.comboTimer = 5;
        race.nitro = Math.min(100, race.nitro + 16);
        notify("貼身超車 / 氮氣 +16%", 1.7);
        beep(700, .11);
      } else {
        race.nitro = Math.min(100, race.nitro + 5);
        notify("超車成功 / 氮氣 +5%", 1.2);
      }
    }
  }

  const order = activeDrivers();
  race.rank = order.findIndex(driver => driver.id === 0) + 1;

  if (race.elapsed >= race.nextElimination) {
    eliminateLast();
  }
}

function project(z, x = 0, cameraS = 0) {
  const perspective = 1 / (1 + z / 210);
  const roadShift =
    (worldCenter(cameraS + z) - worldCenter(cameraS)) * perspective;

  return {
    x: W / 2 + roadShift + x * ROAD_WIDTH * perspective,
    y: HORIZON + (ROAD_BOTTOM - HORIZON) * perspective,
    scale: perspective,
    half: ROAD_WIDTH * perspective
  };
}

function polygon(points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  points.forEach((point, i) => {
    if (i === 0) ctx.moveTo(point[0], point[1]);
    else ctx.lineTo(point[0], point[1]);
  });
  ctx.closePath();
  ctx.fill();
}

function roadStrip(a, b, left, right, color) {
  polygon([
    [a.x + a.half * left, a.y],
    [a.x + a.half * right, a.y],
    [b.x + b.half * right, b.y],
    [b.x + b.half * left, b.y]
  ], color);
}

function drawBackground(cameraS) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#080d20");
  sky.addColorStop(.34, "#28314c");
  sky.addColorStop(.55, "#162a37");
  sky.addColorStop(1, "#090f19");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#aac8cc";
  ctx.beginPath();
  ctx.arc(947, 86, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#152238";
  ctx.beginPath();
  ctx.arc(955, 80, 22, 0, Math.PI * 2);
  ctx.fill();

  const shift = Math.sin(cameraS / 2100) * 25;

  for (const building of buildings) {
    const x = building.x + shift;
    const base = HORIZON + 38;

    ctx.fillStyle = ["#111c30", "#142138", "#19263c"][building.tint];
    ctx.fillRect(x, base - building.height, building.width, building.height);

    for (let row = 0; row < 13; row++) {
      for (let column = 0; column < 4; column++) {
        const hash = (building.seed * 37 + row * 17 + column * 29) % 11;
        if (hash > 4) continue;

        const wx = x + 6 + column * 9;
        const wy = base - building.height + 10 + row * 12;

        if (wx < x + building.width - 4 && wy < base - 4) {
          ctx.fillStyle = hash < 2 ? "#ba95604d" : "#6b9bc13d";
          ctx.fillRect(wx, wy, 3, 5);
        }
      }
    }
  }

  ctx.fillStyle = "#0c1923";
  ctx.fillRect(0, HORIZON + 35, W, H);
}

function drawRoad(cameraS) {
  const steps = 95;

  for (let i = steps; i > 0; i--) {
    const farZ = (i / steps) * VIEW_DISTANCE;
    const nearZ = ((i - 1) / steps) * VIEW_DISTANCE - 35;

    const a = project(farZ, 0, cameraS);
    const b = project(nearZ, 0, cameraS);

    const alternate = Math.floor((cameraS + farZ) / 45) % 2;

    roadStrip(a, b, -1.40, 1.40, alternate ? "#142831" : "#12232c");
    roadStrip(a, b, -1.10, 1.10, alternate ? "#41686d" : "#cad0bb");
    roadStrip(a, b, -1.02, 1.02, alternate ? "#202b39" : "#222e3c");

    roadStrip(a, b, -.985, -.975, "#92d5c288");
    roadStrip(a, b, .975, .985, "#92d5c288");

    if (Math.floor((cameraS + farZ) / 32) % 2 === 0) {
      roadStrip(a, b, -.338, -.325, "#adbbc360");
      roadStrip(a, b, .325, .338, "#adbbc360");
    }

    roadStrip(a, b, -1.30, -1.28, "#314a5e");
    roadStrip(a, b, 1.28, 1.30, "#314a5e");
  }

  // 規律路燈，依世界距離移動。
  const start = Math.floor(cameraS / 115) * 115;

  for (let i = 10; i >= 0; i--) {
    const z = start + i * 115 - cameraS;
    if (z < 10 || z > VIEW_DISTANCE) continue;

    for (const side of [-1, 1]) {
      const p = project(z, side * 1.32, cameraS);
      const poleHeight = 145 * p.scale;

      ctx.strokeStyle = "#668793";
      ctx.lineWidth = Math.max(1, 4 * p.scale);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x, p.y - poleHeight);
      ctx.lineTo(p.x - side * 26 * p.scale, p.y - poleHeight);
      ctx.stroke();

      ctx.fillStyle = "#b9f3df";
      ctx.fillRect(
        p.x - side * 26 * p.scale - 5 * p.scale,
        p.y - poleHeight,
        11 * p.scale,
        3 * p.scale
      );
    }
  }
}

function drawCar(driver, x, y, scale, isPlayer, boosting) {
  const width = 73 * scale;
  const height = 116 * scale;

  ctx.save();
  ctx.translate(x, y);

  if (isPlayer) {
    ctx.rotate(driver.steer * .07);
  }

  ctx.fillStyle = "#0007";
  ctx.beginPath();
  ctx.ellipse(0, 9 * scale, width * .77, height * .22, 0, 0, Math.PI * 2);
  ctx.fill();

  if (boosting) {
    const flame = reducedMotion ? 45 : 38 + Math.random() * 30;

    for (const side of [-1, 1]) {
      polygon([
        [side * width * .23 - 7 * scale, 1],
        [side * width * .23 + 7 * scale, 1],
        [side * width * .23, flame * scale]
      ], "#71e4ff");

      polygon([
        [side * width * .23 - 3 * scale, 1],
        [side * width * .23 + 3 * scale, 1],
        [side * width * .23, flame * .68 * scale]
      ], "#e2ffff");
    }
  }

  // 輪胎。
  ctx.fillStyle = "#060b13";
  ctx.fillRect(-width * .57, -height * .79, width * .18, height * .26);
  ctx.fillRect(width * .39, -height * .79, width * .18, height * .26);
  ctx.fillRect(-width * .57, -height * .29, width * .18, height * .23);
  ctx.fillRect(width * .39, -height * .29, width * .18, height * .23);

  // 車體。
  polygon([
    [-width * .35, -height],
    [width * .35, -height],
    [width * .48, -height * .73],
    [width * .50, -height * .05],
    [width * .38, 0],
    [-width * .38, 0],
    [-width * .50, -height * .05],
    [-width * .48, -height * .73]
  ], driver.color);

  // 引擎蓋與車身陰影。
  polygon([
    [-width * .31, -height * .94],
    [width * .31, -height * .94],
    [width * .35, -height * .74],
    [-width * .35, -height * .74]
  ], "#ffffff20");

  polygon([
    [width * .35, -height],
    [width * .48, -height * .73],
    [width * .50, -height * .05],
    [width * .34, -height * .09]
  ], "#0003");

  // 前後玻璃。
  polygon([
    [-width * .34, -height * .70],
    [width * .34, -height * .70],
    [width * .28, -height * .48],
    [-width * .28, -height * .48]
  ], "#122536");

  polygon([
    [-width * .27, -height * .31],
    [width * .27, -height * .31],
    [width * .34, -height * .16],
    [-width * .34, -height * .16]
  ], "#142837");

  ctx.fillStyle = "#ffffff33";
  ctx.fillRect(-width * .27, -height * .68, width * .51, 3 * scale);

  // 車頂。
  ctx.fillStyle = "#ffffff16";
  ctx.fillRect(-width * .27, -height * .46, width * .54, height * .12);

  // 前燈。
  ctx.fillStyle = "#e2fff8";
  ctx.fillRect(-width * .34, -height * .95, width * .19, 5 * scale);
  ctx.fillRect(width * .15, -height * .95, width * .19, 5 * scale);

  // 尾燈與尾翼。
  ctx.fillStyle = "#ff536c";
  ctx.fillRect(-width * .40, -height * .07, width * .25, 5 * scale);
  ctx.fillRect(width * .15, -height * .07, width * .25, 5 * scale);

  ctx.fillStyle = "#162337";
  ctx.fillRect(-width * .49, -height * .13, width * .98, 5 * scale);

  if (isPlayer) {
    ctx.fillStyle = "#e6fff0";
    ctx.fillRect(-3 * scale, -height * .95, 6 * scale, height * .22);
  }

  ctx.restore();
}

function drawOpponentLabel(driver, p) {
  if (p.scale < .23) return;

  ctx.save();
  ctx.font = "bold " + Math.max(10, 15 * p.scale) + "px Arial";
  ctx.textAlign = "center";
  ctx.fillStyle = "#e5eefa";
  ctx.fillText(driver.name, p.x, p.y - 130 * p.scale);
  ctx.restore();
}

function drawCheckpoint(cameraS) {
  if (!race || mode === "menu") return;

  const remaining = race.nextElimination - race.elapsed;
  if (remaining > 3.5 || remaining < 0) return;

  const z = remaining * Math.max(100, race.player.speed * .6);
  const p = project(z, 0, cameraS);

  const gateY = p.y - 200 * p.scale;

  ctx.strokeStyle = "#e7b46c";
  ctx.lineWidth = Math.max(2, 9 * p.scale);
  ctx.beginPath();
  ctx.moveTo(p.x - p.half * 1.12, p.y);
  ctx.lineTo(p.x - p.half * 1.12, gateY);
  ctx.lineTo(p.x + p.half * 1.12, gateY);
  ctx.lineTo(p.x + p.half * 1.12, p.y);
  ctx.stroke();

  ctx.fillStyle = "#301f26";
  ctx.fillRect(p.x - p.half * 1.12, gateY - 28 * p.scale, p.half * 2.24, 32 * p.scale);

  ctx.fillStyle = "#ffe0a1";
  ctx.font = "bold " + Math.max(10, 19 * p.scale) + "px monospace";
  ctx.textAlign = "center";
  ctx.fillText("ELIMINATION", p.x, gateY - 6 * p.scale);
  ctx.textAlign = "left";
}

function render() {
  const cameraS = race ? race.player.s : menuTime * 70;

  ctx.save();

  if (race && race.shake > 0 && !reducedMotion) {
    ctx.translate(
      (Math.random() - .5) * race.shake,
      (Math.random() - .5) * race.shake
    );
  }

  drawBackground(cameraS);
  drawRoad(cameraS);
  drawCheckpoint(cameraS);

  if (race) {
    const visible = race.drivers
      .filter(driver => {
        if (driver.id === 0 || !driver.alive) return false;
        const z = driver.s - cameraS;
        return z > -45 && z < VIEW_DISTANCE;
      })
      .sort((a, b) => b.s - a.s);

    const ahead = visible.filter(driver => driver.s >= cameraS);
    const behind = visible.filter(driver => driver.s < cameraS);

    for (const driver of ahead) {
      const p = project(driver.s - cameraS, driver.x, cameraS);
      drawCar(driver, p.x, p.y, p.scale, false, false);
      drawOpponentLabel(driver, p);
    }

    const playerProjection = project(0, race.player.x, cameraS);

    drawCar(
      race.player,
      playerProjection.x,
      playerProjection.y,
      1,
      true,
      race.boosting && mode === "racing"
    );

    for (const driver of behind) {
      const p = project(driver.s - cameraS, driver.x, cameraS);
      drawCar(driver, p.x, p.y, p.scale, false, false);
    }

    if (race.boosting && mode === "racing" && !reducedMotion) {
      ctx.strokeStyle = "#b5f4ff44";
      ctx.lineWidth = 2;

      for (let i = 0; i < 16; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const spread = 320 + (i % 6) * 48;
        const phase = (race.elapsed * 2.5 + i * .137) % 1;
        const y = 220 + phase * 460;
        const x = 640 + side * spread * (.4 + phase * .8);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + side * 18, y + 42);
        ctx.stroke();
      }
    }

    if (race.flash > 0) {
      ctx.fillStyle = "rgba(255, 72, 90, " + race.flash * .4 + ")";
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    drawCar(
      { color: "#8affd8", steer: 0 },
      W / 2,
      ROAD_BOTTOM,
      1,
      true,
      false
    );
  }

  const vignette = ctx.createRadialGradient(640, 350, 180, 640, 360, 750);
  vignette.addColorStop(0, "transparent");
  vignette.addColorStop(1, "#02071599");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

function updateHUD() {
  if (!race) return;

  const order = activeDrivers();
  const rank = race.player.alive
    ? order.findIndex(driver => driver.id === 0) + 1
    : race.finishRank;

  const remaining = Math.max(0, race.nextElimination - race.elapsed);
  const last = race.player.alive && rank === order.length && order.length > 1;

  $("rank").textContent = rank;
  $("total").textContent = " / " + (
    race.player.alive ? order.length : race.finishRank
  );

  $("timer").textContent = mode === "finished" ? "--" : remaining.toFixed(1);
  $("eliminationBox").classList.toggle(
    "danger",
    mode === "racing" && (last || remaining < 3)
  );

  $("speed").textContent = String(Math.round(race.player.speed)).padStart(3, "0");
  $("nitroText").textContent = Math.round(race.nitro) + "%";
  $("nitroFill").style.width = race.nitro + "%";

  $("nitroButton").classList.toggle("pressed", race.boosting && mode === "racing");
  $("nitroButton").classList.toggle("empty", race.nitro < 1);

  $("combo").textContent = race.combo > 0
    ? "貼身連續超車 × " + race.combo
    : "一般超車 +5% / 貼身超車 +16%";

  if (mode === "racing") {
    if (Math.abs(race.player.x) > 1) {
      $("warning").textContent = "偏離賽道 / 回到柏油路面";
    } else if (last) {
      $("warning").textContent = "你在淘汰位置 / 立即超車";
    } else if (remaining < 3) {
      $("warning").textContent = "檢查點即將關閉";
    } else {
      $("warning").textContent = "";
    }
  }

  const all = [
    ...order,
    ...race.drivers.filter(driver => !driver.alive)
  ];

  $("leaderboard").replaceChildren();

  all.forEach((driver, i) => {
    const row = document.createElement("div");
    row.className = "leader" +
      (driver.id === 0 ? " me" : "") +
      (!driver.alive ? " out" : "") +
      (driver.alive && i === order.length - 1 ? " last" : "");

    const position = document.createElement("span");
    position.textContent = driver.alive ? String(i + 1).padStart(2, "0") : "--";

    const name = document.createElement("span");
    name.textContent = driver.name;

    const gap = document.createElement("span");
    gap.className = "gap";

    const difference = Math.round(driver.s - race.player.s);

    gap.textContent = !driver.alive
      ? "OUT"
      : driver.id === 0
        ? "YOU"
        : (difference >= 0 ? "+" : "") + difference;

    row.append(position, name, gap);
    $("leaderboard").append(row);
  });
}

function frame(timestamp) {
  const dt = Math.min(.04, (timestamp - previousTime) / 1000 || 0);
  previousTime = timestamp;

  update(dt);
  render();
  updateAudio();

  hudTime += dt;

  if (hudTime >= .1) {
    hudTime = 0;
    updateHUD();
  }

  requestAnimationFrame(frame);
}

/* 手機多點觸控：方向與氮氣分開管理。 */

canvas.addEventListener("pointerdown", event => {
  if (mode !== "racing" && mode !== "countdown") return;
  if (input.steerPointer !== null) return;

  event.preventDefault();

  input.steerPointer = event.pointerId;
  input.originScreenX = event.clientX;
  input.originCarX = race.player.x;
  input.targetX = race.player.x;

  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  if (event.pointerId !== input.steerPointer || !race) return;

  event.preventDefault();

  const bounds = canvas.getBoundingClientRect();
  const delta = (event.clientX - input.originScreenX) / bounds.width;

  input.targetX = clamp(
    input.originCarX + delta * 3.4,
    -1.27,
    1.27
  );
});

function releaseSteering(event) {
  if (event.pointerId === input.steerPointer) {
    input.steerPointer = null;
  }
}

canvas.addEventListener("pointerup", releaseSteering);
canvas.addEventListener("pointercancel", releaseSteering);
canvas.addEventListener("lostpointercapture", releaseSteering);

$("nitroButton").addEventListener("pointerdown", event => {
  if (mode !== "racing") return;
  if (input.boostPointer !== null) return;

  event.preventDefault();
  input.boostPointer = event.pointerId;
  $("nitroButton").setPointerCapture(event.pointerId);
});

function releaseBoost(event) {
  if (event.pointerId === input.boostPointer) {
    input.boostPointer = null;
  }
}

$("nitroButton").addEventListener("pointerup", releaseBoost);
$("nitroButton").addEventListener("pointercancel", releaseBoost);
$("nitroButton").addEventListener("lostpointercapture", releaseBoost);

/* 鍵盤操作。 */

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    ["arrowleft", "arrowright", "a", "d", " "].includes(key) &&
    (mode === "racing" || mode === "countdown")
  ) {
    event.preventDefault();
  }

  if (mode === "racing" || mode === "countdown") {
    if (key === "a" || key === "arrowleft") input.left = true;
    if (key === "d" || key === "arrowright") input.right = true;
    if (key === " ") input.boostKey = true;
  }

  if (key === "p" && !event.repeat) {
    if (mode === "paused") {
      if (mainAction) mainAction();
    } else {
      pauseRace();
    }
  }
});

document.addEventListener("keyup", event => {
  const key = event.key.toLowerCase();

  if (key === "a" || key === "arrowleft") input.left = false;
  if (key === "d" || key === "arrowright") input.right = false;
  if (key === " ") input.boostKey = false;
});

window.addEventListener("blur", () => {
  resetInput();
  pauseRace();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    resetInput();
    pauseRace();
  }
});

window.addEventListener("resize", () => {
  resetInput();
});

$("pauseButton").addEventListener("click", pauseRace);

$("soundButton").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  $("soundButton").textContent = soundEnabled ? "音效 開" : "音效 關";
  $("soundButton").setAttribute("aria-pressed", String(soundEnabled));

  prepareAudio();
  updateAudio();

  if (soundEnabled) beep(620, .12);
});

$("mainButton").addEventListener("click", () => {
  if (mainAction) mainAction();
});

$("secondaryButton").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if ($("game").requestFullscreen) {
      await $("game").requestFullscreen();

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (_) {}
    } else {
      $("secondaryButton").textContent = "此瀏覽器請直接橫放手機";
    }
  } catch (_) {
    $("secondaryButton").textContent = "請橫放手機遊玩";
  }
});

document.addEventListener("fullscreenchange", () => {
  $("secondaryButton").textContent =
    document.fullscreenElement ? "退出全螢幕" : "進入全螢幕";
});

document.addEventListener("contextmenu", event => {
  if ($("game").contains(event.target)) event.preventDefault();
});

showOverlay(
  "MIDNIGHT / ELIMINATION",
  "午夜\n淘汰賽",
  "八台車，七次淘汰。\n每十二秒，最後一名離場。\n你要做的，就是留到最後。",
  "拖曳畫面左右轉向，自動加速。\n" +
  "按住右下角氮氣，衝出車陣。\n" +
  "貼身超車可補充大量氮氣。\n" +
  "撞車或衝出路面會明顯減速。\n" +
  "電腦可用方向鍵與 Space。",
  "開始比賽",
  startRace
);

requestAnimationFrame(frame);
</script>
</body>
</html>
